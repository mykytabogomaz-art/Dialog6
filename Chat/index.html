
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Знайомство</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #93c5fd; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6; 
        }
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-3xl w-full bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col h-[80vh] min-h-[600px]">
        
        <div class="bg-gradient-to-r from-blue-500 to-indigo-500 text-white p-6 text-center shrink-0">
            <h1 class="text-3xl font-bold mb-2">Давай знайомитись! 🤝</h1>
            <p id="progress-text" class="text-blue-100 font-medium text-lg">Повідомлення 1 з 10</p>
        </div>

        <div id="chat-container" class="flex-1 p-6 overflow-y-auto bg-slate-50 space-y-6">
            <!-- Повідомлення -->
        </div>

        <div id="input-area" class="bg-white p-4 border-t border-gray-200 shrink-0">
            <form id="answer-form" class="flex gap-4">
                <div class="text-4xl self-center hidden sm:block">👦</div>
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Напиши свою відповідь тут..." 
                    class="flex-1 bg-green-50 border-2 border-green-200 focus:border-green-400 focus:ring-0 rounded-2xl px-6 py-4 text-lg outline-none transition-colors"
                    autocomplete="off"
                    required
                >
                <button 
                    type="submit" 
                    class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-2xl transition-transform hover:scale-105 active:scale-95 flex items-center gap-2"
                >
                    Відповісти
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </form>
        </div>

        <div id="results-area" class="hidden flex-1 p-8 overflow-y-auto bg-white">
            <div class="text-center mb-8 fade-in-up">
                <div class="text-6xl mb-4">🎉</div>
                <h2 class="text-3xl font-bold text-gray-800">Приємно було познайомитись!</h2>
                <p class="text-gray-500 mt-2 text-lg">Ось історія нашої розмови:</p>
            </div>
            <div id="history-list" class="space-y-4 max-w-2xl mx-auto">
                <!-- Історія -->
            </div>
            <div class="mt-10 text-center fade-in-up" style="animation-delay: 0.3s;">
                <button 
                    onclick="restart()" 
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-10 rounded-full text-lg transition-transform hover:scale-105 active:scale-95 shadow-lg"
                >
                    Почати нову розмову
                </button>
            </div>
        </div>

    </div>

    <script>
        // Оновлений список реплік
        const questions = [
            "Привіт!",
            "Давай знайомитись. Як тебе звати?",
            "А скільки тобі років?",
            "Ти зараз навчаєшся чи працюєш?",
            "Цікаво! А де ти навчаєшся?",
            "Скажи, а де ти жив у 2020 році?",
            "А де ти живеш зараз?",
            "Чим ти найбільше любиш займатися у вільний час?",
            "У тебе є домашня тварина?",
            "Як звати твою домашню тварину?"
        ];

        let currentStep = 0;
        const answers = [];

        const chatContainer = document.getElementById('chat-container');
        const answerForm = document.getElementById('answer-form');
        const userInput = document.getElementById('user-input');
        const progressText = document.getElementById('progress-text');
        const inputArea = document.getElementById('input-area');
        const resultsArea = document.getElementById('results-area');
        const historyList = document.getElementById('history-list');

        function init() {
            renderBotMessage(questions[currentStep]);
            updateProgress();
            userInput.focus();
        }

        answerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const text = userInput.value.trim();
            if (!text) return;

            answers.push({
                question: questions[currentStep],
                answer: text
            });

            renderUserMessage(text);
            
            userInput.value = '';
            currentStep++;

            if (currentStep < questions.length) {
                userInput.disabled = true;
                
                setTimeout(() => {
                    renderBotMessage(questions[currentStep]);
                    updateProgress();
                    userInput.disabled = false;
                    userInput.focus();
                    scrollToBottom();
                }, 800);
            } else {
                setTimeout(() => {
                    showResults();
                }, 1000);
            }
            
            scrollToBottom();
        });

        function renderBotMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex items-end gap-3 fade-in-up';
            msgDiv.innerHTML = `
                <div class="text-4xl shadow-sm bg-white rounded-full p-2 h-14 w-14 flex items-center justify-center">👨</div>
                <div class="bg-blue-100 text-blue-900 rounded-2xl rounded-bl-none px-6 py-4 shadow-sm max-w-[80%]">
                    <p class="text-lg leading-relaxed">${text}</p>
                </div>
            `;
            chatContainer.appendChild(msgDiv);
        }

        function renderUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex items-end gap-3 justify-end fade-in-up';
            msgDiv.innerHTML = `
                <div class="bg-green-100 text-green-900 rounded-2xl rounded-br-none px-6 py-4 shadow-sm max-w-[80%]">
                    <p class="text-lg leading-relaxed">${text}</p>
                </div>
                <div class="text-4xl shadow-sm bg-white rounded-full p-2 h-14 w-14 flex items-center justify-center sm:hidden">👦</div>
            `;
            chatContainer.appendChild(msgDiv);
        }

        function updateProgress() {
            progressText.innerText = `Повідомлення ${currentStep + 1} з ${questions.length}`;
        }

        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function showResults() {
            chatContainer.style.display = 'none';
            inputArea.style.display = 'none';
            progressText.innerText = "Готово!";
            
            historyList.innerHTML = '';
            
            answers.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bg-gray-50 rounded-2xl p-6 border border-gray-100 fade-in-up';
                itemDiv.style.animationDelay = `${index * 0.1}s`;
                itemDiv.innerHTML = `
                    <div class="flex items-start gap-3 mb-3">
                        <span class="text-2xl mt-1">👨</span>
                        <p class="text-gray-600 font-medium text-lg pt-1">${item.question}</p>
                    </div>
                    <div class="flex items-start gap-3 justify-end pl-10">
                        <p class="text-gray-900 font-bold text-xl text-right bg-green-50 px-4 py-2 rounded-xl border border-green-100">${item.answer}</p>
                        <span class="text-2xl mt-1">👦</span>
                    </div>
                `;
                historyList.appendChild(itemDiv);
            });

            resultsArea.classList.remove('hidden');
            resultsArea.classList.add('flex', 'flex-col');
        }

        function restart() {
            currentStep = 0;
            answers.length = 0;
            
            chatContainer.innerHTML = '';
            
            resultsArea.classList.add('hidden');
            resultsArea.classList.remove('flex', 'flex-col');
            
            chatContainer.style.display = 'block';
            inputArea.style.display = 'block';
            
            init();
        }

        init();
    </script>
</body>
</html>
